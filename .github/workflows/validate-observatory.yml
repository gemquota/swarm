name: Validate swarm observatory

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structural-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate observatory contracts and local links
        run: python3 scripts/validate_observatory.py
